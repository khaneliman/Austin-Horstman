<div class="sticky top-16 z-40 border-b border-stone-200 bg-white dark:border-slate-800 dark:bg-slate-900">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="py-3">
      <a [routerLink]="backRoute()" [class]="backLinkClasses">
        <ng-icon name="heroChevronLeft" size="1rem" aria-hidden="true"></ng-icon>
        {{ backLabel() }}
      </a>
    </div>

    @if (projects().length > 0) {
      <div class="project-nav-header__quick-nav flex min-w-0 border-t border-stone-200 dark:border-slate-800">
        @if (hasOverflow()) {
          <button
            type="button"
            class="project-nav-header__scroll-button"
            aria-label="Scroll projects left"
            title="Scroll projects left"
            [disabled]="!canScrollLeft()"
            (click)="scrollProjects(-1)"
            (pointerenter)="startEdgeScroll(-1, $event)"
            (pointerleave)="stopEdgeScroll()"
            (pointercancel)="stopEdgeScroll()"
            (blur)="stopEdgeScroll()"
          >
            <ng-icon name="heroChevronLeft" size="1.1rem" aria-hidden="true"></ng-icon>
          </button>
        }
        <nav
          #quickNavigation
          class="project-nav-header__quick-nav-scroll flex min-w-0 flex-1 items-center gap-1 overflow-x-auto px-1 pb-1"
          aria-label="Project quick navigation"
          (scroll)="updateScrollState()"
        >
          @for (project of projects(); track project.route) {
            <a
              [routerLink]="project.route"
              [class]="project.isActive ? activeTabClasses : inactiveTabClasses"
              [attr.aria-current]="project.isActive ? 'page' : null"
            >
              {{ project.name }}
            </a>
          }
        </nav>
        @if (hasOverflow()) {
          <button
            type="button"
            class="project-nav-header__scroll-button"
            aria-label="Scroll projects right"
            title="Scroll projects right"
            [disabled]="!canScrollRight()"
            (click)="scrollProjects(1)"
            (pointerenter)="startEdgeScroll(1, $event)"
            (pointerleave)="stopEdgeScroll()"
            (pointercancel)="stopEdgeScroll()"
            (blur)="stopEdgeScroll()"
          >
            <ng-icon name="heroChevronRight" size="1.1rem" aria-hidden="true"></ng-icon>
          </button>
        }
      </div>
    }
  </div>
</div>
