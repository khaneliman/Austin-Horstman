name: .NET WebApi Build
on:
  push:
    branches: [main]
    paths:
      - 'WebApi/**/*'
  pull_request:
    branches: [main]
    paths:
      - 'WebApi/**/*'
jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: WebApi/global.json
          cache: true
          cache-dependency-path: WebApi/packages.lock.json
      - name: Restore dependencies
        run: dotnet restore WebApi/ --locked-mode
      - name: Build
        run: dotnet build WebApi/ --configuration Release --no-restore
      - name: Test
        run: dotnet test WebApi/ --configuration Release --no-build --verbosity normal
