services:
  webapi:
    build:
      context: ./WebApi
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    networks:
      - backend

  webapp:
    build:
      context: ./WebApp
      dockerfile: Dockerfile.production
    ports:
      - "${WEBAPP_BIND_ADDRESS:-127.0.0.1}:${WEBAPP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    networks:
      - edge
      - backend

networks:
  edge:
  backend:
    internal: true
